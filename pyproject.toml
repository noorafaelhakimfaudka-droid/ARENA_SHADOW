[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-arena"
version = "2.0.0"
description = "Markas Emosi Debat Multi-Agent ML & Laboratorium Riset Auditable"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "joblib>=1.4.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "playwright>=1.45.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
